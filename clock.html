<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Годинник</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
html,body{margin:0;height:100%;background:#000;color:#e8e8e8;overflow:hidden;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none}
#wrap{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;
  -webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;
  -webkit-align-items:center;align-items:center;text-align:center;
  -webkit-transition:opacity 2s;transition:opacity 2s}

/* ---- перекидний годинник ---- */
#cards{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.card{position:relative;width:20vmin;height:28vmin;margin:0 0.7vmin;
  -webkit-perspective:70vmin;perspective:70vmin}
.card:after{content:"";position:absolute;left:0;right:0;top:50%;height:0.5vmin;margin-top:-0.25vmin;
  background:#000;z-index:5}
.half,.flap{position:absolute;left:0;right:0;height:50%;overflow:hidden;color:#f2f2f2}
.top,.ft{top:0;background:#1f1f1f;border-radius:1.6vmin 1.6vmin 0 0}
.bot,.fb{bottom:0;background:#181818;border-radius:0 0 1.6vmin 1.6vmin}
.half span,.flap span{position:absolute;left:0;right:0;height:28vmin;line-height:28vmin;
  font-size:24vmin;font-weight:700;text-align:center}
.top span,.ft span{top:0}
.bot span,.fb span{bottom:0}
.flap{display:none;z-index:3;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.ft{-webkit-transform-origin:50% 100%;transform-origin:50% 100%}
.fb{-webkit-transform-origin:50% 0;transform-origin:50% 0;
  -webkit-transform:rotateX(90deg);transform:rotateX(90deg)}
.go .ft{display:block;-webkit-animation:ftop .3s ease-in both;animation:ftop .3s ease-in both}
.go .fb{display:block;-webkit-animation:fbot .3s ease-out .3s both;animation:fbot .3s ease-out .3s both}
@-webkit-keyframes ftop{from{-webkit-transform:rotateX(0)}to{-webkit-transform:rotateX(-90deg)}}
@keyframes ftop{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@-webkit-keyframes fbot{from{-webkit-transform:rotateX(90deg)}to{-webkit-transform:rotateX(0)}}
@keyframes fbot{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.sep{width:3vmin;height:11vmin;margin:0 0.6vmin;position:relative}
.sep:before,.sep:after{content:"";position:absolute;left:50%;width:1.6vmin;height:1.6vmin;
  margin-left:-0.8vmin;border-radius:50%;background:#f2f2f2}
.sep:before{top:2.5vmin}.sep:after{bottom:2.5vmin}

#date{font-weight:300;font-size:3.8vmin;margin-top:5vmin;color:#9a9a9a}
#now{margin-top:4vmin;font-weight:300;font-size:7vmin;line-height:1}
#now small{display:block;font-size:2.8vmin;font-weight:300;color:#9a9a9a;margin-top:1vmin}
#days{margin-top:4vmin;display:-webkit-flex;display:flex}
.d{margin:0 3vmin;font-size:2.4vmin;font-weight:300;color:#9a9a9a}
.d b{display:block;font-weight:400;color:#e8e8e8;font-size:2.8vmin;margin-top:0.6vmin}
#err{position:absolute;bottom:1vmin;left:0;right:0;text-align:center;font-size:1.6vmin;color:#444}
</style>
</head>
<body>
<div id="wrap">
  <div id="cards"></div>
  <div id="date"></div>
  <div id="now"><span id="icon"></span> <span id="temp">--</span>
    <small id="desc"></small></div>
  <div id="days"></div>
</div>
<div id="err"></div>

<script>
var NIGHT_FROM = 22, NIGHT_TO = 6;   // нічний режим: приглушення

var DAYS = ["неділя","понеділок","вівторок","середа","четвер","пʼятниця","субота"];
var DAYS_SHORT = ["нд","пн","вт","ср","чт","пт","сб"];
var MONTHS = ["січня","лютого","березня","квітня","травня","червня","липня",
  "серпня","вересня","жовтня","листопада","грудня"];

function pad(n){ return n < 10 ? "0" + n : "" + n; }
function $(id){ return document.getElementById(id); }

/* ---- картки ---- */
var cards = [];
(function build(){
  var box = $("cards"), i, c, s;
  for (i = 0; i < 4; i++) {
    if (i === 2) { s = document.createElement("div"); s.className = "sep"; box.appendChild(s); }
    c = document.createElement("div");
    c.className = "card";
    c.innerHTML = '<div class="half top"><span></span></div><div class="half bot"><span></span></div>' +
      '<div class="flap ft"><span></span></div><div class="flap fb"><span></span></div>';
    box.appendChild(c);
    cards.push(c);
  }
})();

function q(c, sel){ return c.querySelector(sel); }
function setDigit(c, v){
  if (c._v === undefined) {
    q(c, ".top span").textContent = v; q(c, ".bot span").textContent = v;
    q(c, ".ft span").textContent = v;  q(c, ".fb span").textContent = v;
    c._v = v; return;
  }
  if (c._v === v) return;
  var old = c._v; c._v = v;
  q(c, ".top span").textContent = v;
  q(c, ".ft span").textContent = old;
  q(c, ".fb span").textContent = v;
  c.className = "card"; void c.offsetWidth; c.className = "card go";
  clearTimeout(c._t);
  c._t = setTimeout(function(){ q(c, ".bot span").textContent = v; c.className = "card"; }, 700);
}

function codeInfo(c){
  if (c === 0) return ["☀️","Ясно"];
  if (c <= 2) return ["🌤","Мінлива хмарність"];
  if (c === 3) return ["☁️","Хмарно"];
  if (c === 45 || c === 48) return ["🌫","Туман"];
  if (c >= 51 && c <= 57) return ["🌦","Мряка"];
  if (c >= 61 && c <= 67) return ["🌧","Дощ"];
  if (c >= 71 && c <= 77) return ["❄️","Сніг"];
  if (c >= 80 && c <= 82) return ["🌧","Злива"];
  if (c === 85 || c === 86) return ["❄️","Снігопад"];
  if (c >= 95) return ["⛈","Гроза"];
  return ["·",""];
}

function tick(){
  var d = new Date(), h = pad(d.getHours()), m = pad(d.getMinutes());
  setDigit(cards[0], h.charAt(0)); setDigit(cards[1], h.charAt(1));
  setDigit(cards[2], m.charAt(0)); setDigit(cards[3], m.charAt(1));
  $("date").innerHTML = DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
  var hr = d.getHours();
  var night = (NIGHT_FROM > NIGHT_TO) ? (hr >= NIGHT_FROM || hr < NIGHT_TO) : (hr >= NIGHT_FROM && hr < NIGHT_TO);
  $("wrap").style.opacity = night ? "0.35" : "1";
}

function round(n){ return Math.round(n); }
function sign(n){ n = round(n); return (n > 0 ? "+" : "") + n + "°"; }

function loadWeather(){
  var x = new XMLHttpRequest();
  x.open("GET", "weather.json?t=" + new Date().getTime(), true);
  x.timeout = 20000;
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    if (x.status === 200) {
      try { render(JSON.parse(x.responseText)); $("err").innerHTML = ""; }
      catch (e) { $("err").innerHTML = "помилка даних погоди"; }
    } else {
      $("err").innerHTML = "немає звʼязку з погодою (код " + x.status + ")";
    }
  };
  x.send();
}

function render(w){
  var cur = codeInfo(w.current.weather_code);
  $("icon").innerHTML = cur[0];
  $("temp").innerHTML = sign(w.current.temperature_2m);
  $("desc").innerHTML = cur[1];
  var html = "", i, dt, info, p;
  for (i = 1; i < w.daily.time.length; i++) {
    p = w.daily.time[i].split("-");
    dt = new Date(+p[0], +p[1] - 1, +p[2]);
    info = codeInfo(w.daily.weather_code[i]);
    html += '<div class="d">' + DAYS_SHORT[dt.getDay()] + '<b>' + info[0] + ' ' +
      sign(w.daily.temperature_2m_max[i]) + ' / ' + sign(w.daily.temperature_2m_min[i]) + '</b></div>';
  }
  $("days").innerHTML = html;
}

tick();
setInterval(tick, 1000);
loadWeather();
setInterval(loadWeather, 10 * 60 * 1000);
</script>
</body>
</html>
